<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #202124;
      background: #fff;
    }

    header {
      padding: 12px 16px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
    }

    #save-all {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      color: #fff;
      background: #1a73e8;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #save-all:hover { background: #1565c0; }
    #save-all:disabled { background: #94c4f7; cursor: default; }

    #groups {
      max-height: 400px;
      overflow-y: auto;
    }

    .group-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid #f1f1f1;
    }

    .group-row:last-child { border-bottom: none; }

    .group-info {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .group-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .group-name {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .group-count {
      color: #5f6368;
      font-size: 12px;
      flex-shrink: 0;
      margin-right: 10px;
    }

    .save-btn {
      padding: 4px 10px;
      font-size: 12px;
      color: #1a73e8;
      background: transparent;
      border: 1px solid #dadce0;
      border-radius: 4px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .save-btn:hover { background: #f0f6ff; }
    .save-btn:disabled { color: #94c4f7; border-color: #e8e8e8; cursor: default; background: transparent; }

    .save-btn.saved {
      color: #188038;
      border-color: #ceead6;
    }

    #empty {
      padding: 32px 16px;
      text-align: center;
      color: #5f6368;
    }

    #status {
      padding: 8px 16px;
      font-size: 12px;
      color: #188038;
      text-align: center;
      display: none;
      border-top: 1px solid #e0e0e0;
    }

    #settings {
      padding: 10px 16px;
      border-top: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    #settings label {
      font-size: 12px;
      color: #5f6368;
      white-space: nowrap;
    }

    #location {
      font-size: 12px;
      padding: 3px 6px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      background: #fff;
      color: #202124;
      flex: 1;
      min-width: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Tab Group Bookmarks</h1>
    <button id="save-all">Save All</button>
  </header>
  <div id="groups"></div>
  <div id="empty">No tab groups found in this window.</div>
  <div id="settings">
    <label for="location">Save to:</label>
    <select id="location"></select>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
